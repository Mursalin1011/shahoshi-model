[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shahoshi"
version = "0.1.0"
description = "Multimodal edge-ML threat detection for the Shahoshi safety wearable"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

# TensorFlow is deliberately NOT a hard dependency. Training and quantization run
# on Colab, where TF is preinstalled and pinned against a matching NumPy -- adding
# `tensorflow` here would let pip hot-swap NumPy's C extension underneath a live
# kernel, which is the documented cause of the "numpy.dtype size changed" crash.
# Everything in this package except shahoshi.models and shahoshi.quantize is
# pure NumPy/SciPy and importable (and testable) without TF.
[project.optional-dependencies]
train = ["tensorflow>=2.16", "scikit-learn>=1.3", "matplotlib>=3.7"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
